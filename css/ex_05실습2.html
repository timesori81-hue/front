<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        /*테두리까지 포함해서 넓이까지 지정*/
        box-sizing: border-box;
      }
      #check {
        width: 540px;
        border: 1px solid#ccc;
        text-align: center;
      }
      #container {
        padding: 10px 20px 30px 40px;
        /*값이4개 들어갔을때 순서뒤 오른쪽 아래 왼쪽*/

        border: 1px solid red;
        border-style: dashed;
        border-width: 2px;
        border-radius: 100px;
        font-family: "맑은고딕" 고딕 궁서;
        box-shadow: 10px 5px 5px 5px rgb(184, 55, 96);
        width: 600px;
        margin: 0;
        padding: 5px;
      }
      h1 {
        margin: 0px;
        font-size: 1rem;
        background-color: black;
        color: white;
      }
      h2 {
        color: red;
        font-size: 1.45rem;
      }
      .accent {
        color: blue;
      }
      .p {
        font-size: 1.2px;
        font-weight: 600;
        text-align: center;
        line-height: 30rem;
      }
      .smalltext {
        font-size: 16px;
      }
      .container img {
        margin-top: 100px;
        border-end-end-radius: 100px;
        border-end-end-radius: 100px;
        border-end-end-radius: 100px;
        width: 100%;
      }
      .bear {
        border-radius: 100%;
        box-shadow: 5px 5px 10px 5px #333;
        border: 20px dashed wheat;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <img id="bear" src="/html/img/bear.jpg" alt="" />
      <img id="/html/img/귤.png" alt="" />

      <div id="check">
        <h1>확인하세요</h1>
        <h2>주문 및 배송</h2>
        <p>
          <span class="accent">오후 2시 이전</span> 주문건은 당일 발송합니다<br />
          2시 이후 주문건은 다음날 발송합니다(주말 제외)
        </p>
        <hr />
        <h2>교환 및 환불</h2>
        <p>
          불만족시 <span class="accent">100% 환불</span>해 드립니다<br />
          고객센터로 전화주세요
        </p>
        <hr />
        <h2>고객센터</h2>
        <p>
          0000-0000<br />
          <span class="smalltext"
            >상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span
          >
        </p>
      </div>
    </div>
  </body>
</html>
