    <style>
        /* 선택자 (스타일  속성값;)
         :모든요소선택
         클래스명: 요소에 클래스 속성에 클래스이름을 넣어줌
         하나의 요소가 여러개의 클래스를 지정 할수 있다
         #아이디
         */
        /* 0 2 3 4 5 6 7 8 9 
        색상을 16진수 숫자로 표현하는 방법
        #000 #000000 : 검정색
        #ffff #ffff :회색
        무채색 표현 할때*/
        .title{
            color: #fff;
            background-color: #333;
            /*display: 컨텐츠 만큼 자리를 차지
            block: 한줄을 목땅 차지*/
            display: inline;
            /*상하 20px  좌우 10px*/
            padding: 20px 10px





        }
        .ul{
            list-style-type: style none;  /*라스트 블릿을 제거*/


        }

        li{color: blue; list-style: none;
         font-size: 16px ;
         font-weight: bolder;
         font-family: "맑은고딕"
        
        }
        .titlel{
            /*요소가 영역을 차지 하는방법*/
            display: inline-block
             inline-block #333;
            color: #fff;
            /*글자 가운데 정렬*/
            height: 500px;
            width: 80px;
            line-height: 80px;
            text-align: center;


        }
        a{
            /*링크에 믿줄을 제거 하기 위해서*/
            text-decoration: none;
            clear: #333;


        }
        
              

    </style>
