<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        div{background-color: burlywood;
        width: 100px;
        height: 100px;
        border: 1px solid brown;
        display: inline-block;
        
     
    }
    #container{
        /*자식 요소가 부모의여역을 벗난경우 처리할지 결정*/
        overflow: auto;
        width: 500px;
        height: 300px;
        
    }
    #accent{
        color: brown;
        font-weight: 500;
        font-style: italic;
       

        



    }
    #none{
        display: none;
    }
    

    </style>
  </head>
  <body>
    <!--div: 박스-->
    <div>박스1</div>
    <div>박스2</div>

    <hr>
    <div id="container" class="none">
      <h1>탐라국 입춘굿</h1>
      <p>
        제주도의 문화축제 중에서 유일하게
        <span class="accent">전통시대부터 존재했던 축제</span>이다.
      </p>
      <p>
        제주에서 입춘은 새철<sup>(제주어, 샛절)</sup> 드는 날. <br />
        하늘의 1만8000신이 지상으로 내려와 새해 일들을 시작하는 때다.
      </p>
    </div>
  </body>
</html>
