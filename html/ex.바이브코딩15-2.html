<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레드향 주문하기 - Apple Style</title>
  <style>
    /* 1. 기본 초기화 및 애플 스타일 폰트/배경 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 2. 상단 반응형 내비게이션 바 (반투명 유리 효과) */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .nav-container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 20px;
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: #1d1d1f;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #1d1d1f;
      font-size: 13px;
      font-weight: 400;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    /* 3. 메인 컨테이너 & 타이틀 */
    .main-container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .hero-title {
      margin-bottom: 36px;
    }

    .hero-title .badge {
      color: #bf4800;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .hero-title h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .hero-title p {
      font-size: 19px;
      color: #86868b;
      margin-top: 8px;
    }

    /* 4. 반응형 2단 그리드 (PC: 좌우 배치 / 모바일: 상하 배치) */
    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 40px;
      align-items: start;
    }

    /* 왼쪽 상품 이미지 카드 */
    .product-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 80px;
    }

    .product-card img {
      width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
      object-fit: cover;
      aspect-ratio: 4 / 3;
    }

    .product-info {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-info h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .product-info span {
      font-size: 16px;
      color: #86868b;
    }

    /* 오른쪽 주문 폼 카드 */
    .form-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .form-card h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      background-color: #ffffff;
      color: #1d1d1f;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0071e3;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    .form-group input[readonly] {
      background-color: #f5f5f7;
      color: #86868b;
      cursor: not-allowed;
    }

    .helper-text {
      display: block;
      font-size: 12px;
      color: #86868b;
      margin-top: 6px;
    }

    /* 5. 애플 스타일 버튼 */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #0077ed;
    }

    .btn-secondary {
      background-color: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background-color: #e8e8ed;
    }

    /* 6. 반응형 미디어 쿼리 (태블릿 및 모바일 화면 대응) */
    @media (max-width: 768px) {
      .nav-links {
        gap: 16px;
      }

      .hero-title h1 {
        font-size: 32px;
      }

      .order-grid {
        grid-template-columns: 1fr; /* 1단으로 변경 */
        gap: 24px;
      }

      .product-card {
        position: static; /* 모바일에서는 고정 해제 */
      }

      .form-card {
        padding: 24px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 메뉴 -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">🍊 Jeju Farm</a>
      <ul class="nav-links">
        <li><a href="#">스토어</a></li>
        <li><a href="#">레드향</a></li>
        <li><a href="#">한라봉</a></li>
        <li><a href="#">배송안내</a></li>
        <li><a href="#">고객지원</a></li>
      </ul>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="main-container">
    <div class="hero-title">
      <span class="badge">제주 산지직송</span>
      <h1>레드향 주문하기</h1>
      <p>당도 선별된 프리미엄 제주 레드향을 집 앞까지.</p>
    </div>

    <div class="order-grid">
      <!-- 왼쪽: 상품 이미지 카드 (이미지 경로는 보유하신 파일명으로 수정하세요) -->
      <div class="product-card">
        <img src="https://unsplash.com" alt="제주 레드향">
        <div class="product-info">
          <h3>레드향 상품용 3KG</h3>
          <span>₩35,000</span>
        </div>
      </div>

      <!-- 오른쪽: 배송 정보 입력 폼 -->
      <div class="form-card">
        <h2>배송 정보 입력</h2>
        <form action="#">
          <div class="form-group">
            <label for="prod">주문 상품</label>
            <input type="text" id="prod" value="상품용 3KG" readonly>
          </div>

          <div class="form-group">
            <label for="user-name">이름</label>
            <input type="text" id="user-name" placeholder="수령인 성함을 입력하세요" required>
          </div>

          <div class="form-group">
            <label for="addr">배송 주소</label>
            <input type="text" id="addr" placeholder="도로명 주소를 입력하세요" required>
          </div>

          <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="example@icloud.com" required>
          </div>

          <div class="form-group">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" placeholder="하이픈 빼고 입력해 주세요 (01012345678)" required>
          </div>

          <div class="form-group">
            <label for="delivery-date">배송 지정</label>
            <input type="date" id="delivery-date" required>
            <span class="helper-text">주문일로부터 최소 3일 이후 날짜를 선택해 주세요.</span>
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary">주문하기</button>
            <button type="reset" class="btn btn-secondary">취소하기</button>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
