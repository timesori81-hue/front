<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form accept=""> </form>
     화면에 보이지 않지만 숨겨진 핑드가 있다<br>
     주로 서버에 값을 전달 하거나 사용자의 상태를 체크하기 위해<br>
     <input type="hidden"name="checkId">
     <hr>
     이메일 체크 기능이 추가<br>
     @가 있는지 체크<br>
     required : 필수 입력 체크

     <input type="search" name="search" id="" required>
     <hr>

     <input type="range" name="range" id="">
     <hr>
      <input type="number" name="number" id="" min="0" step="10">
     숫자를입력하고 저절하는 스핀버튼이 자동으로 생성 됨
     최대값,최소값,종감값을 지정
     <input type="number" name="number" id="" min="0" max="99" step="10">
     <hr>
     <input type="file">
     <input type="text" name="" id="" readonly value="readonly">
      readonly: 읽기전용 필드로 변경

     <hr>
     <input type="submit" value="전송" >
    <form></form>
    
</body>
</html>
