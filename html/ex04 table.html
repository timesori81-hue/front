<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--css-->
    <style>
        /* 선택자를 이용해서 요소를 선택*/
        /* 스타일 추석
        태그명 {스타일 작성}
        */
        td{text-align: center;}
    </style>
</head>
<body>

    <table border="1">
        <caption>선물용과 가정용 상품 구성</caption>
        <tr>
            <!--th : 제목(가운데 정렬 + bold)-->
            <th width="100px">용도</th>
            <th width="100px">중량</th>
            <th width="100px">갯수</th>
            <th width="100px">가격</th>
        </tr>
        <tr>
            <td rowspan="2">선물용</td>
            <td>3kg</td>
            <td>11~16과</td>
            <td>35,000원</td>
        </tr>
        <tr>
            <!-- 선물용 칸은 위에서 rowspan으로 합쳤으니 여기엔 안 씀 -->
            <td>5kg</td>
            <td>18~26과</td>
            <td>52,000원</td>
        </tr>
        <tr>
            <td rowspan="2">가정용</td>
            <td>3kg</td>
            <td>11~16과</td>
            <td>30,000원</td>
        </tr>
        <tr>
            <!-- 가정용 칸도 위에서 합쳤으니 여기엔 안 씀 -->
            <td>5kg</td>
            <td>18~26과</td>
            <td>47,000원</td>
        </tr>
    </table>

</body>
</html>
